name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Carlosfrancog/Paradigmas-de-Linguagens-de-Programa-o'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare public static assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/material
          required=(
            index.html styles.css v4.css v5.css
            app.js data.js v3.js v3-content.js v4.js
            workshop.js lab-bank.js hotfix-contrast.css
            pdf-mobile-fix.css pdf-mobile-fix.js
            exam-clock.css exam-clock.js skins-extra.css
            study-polish.css sw.js icon-192.png icon-512.png
            icon-maskable.png favicon.svg manifest.webmanifest
            guided.json guided-v3.json
          )
          missing=0
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Arquivo obrigatório ausente ou vazio: $file"
              missing=1
            fi
          done
          if (( missing )); then
            exit 1
          fi
          cp -- "${required[@]}" dist/
          shopt -s nullglob
          pdfs=(material/*.pdf)
          if (( ${#pdfs[@]} != 14 )); then
            echo "::error::Esperados 14 PDFs em material/, encontrados ${#pdfs[@]}."
            exit 1
          fi
          cp -- "${pdfs[@]}" dist/material/
          test -s dist/index.html
          echo "Arquivos públicos preparados com sucesso."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
