name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Carlosfrancog/Paradigmas-de-Linguagens-de-Programa-o'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare public static assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/material
          cp index.html styles.css v4.css v5.css app.js data.js v3.js v3-content.js v4.js workshop.js lab-bank.js lab-runner.css hotfix-contrast.css pdf-mobile-fix.css pdf-mobile-fix.js executor-config.json favicon.svg manifest.webmanifest guided.json guided-v3.json dist/
          cp material/*.pdf dist/material/
          test -s dist/index.html
          test "$(find dist/material -maxdepth 1 -name '*.pdf' | wc -l)" -eq 14
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
